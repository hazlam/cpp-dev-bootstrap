# Enforces the stacked-diffs PR size limits: warns over 200 changed lines and
# fails over 300, measured against the PR's own base branch (so a layer in a
# stack is measured against the layer below it, not against trunk).
#
# Lockfiles, snapshots, vendored code and files marked linguist-generated or
# linguist-vendored in .gitattributes are not counted.
#
# To exempt a PR (e.g. an approved tool-driven rename), add the
# `size-exempt` label.
name: pr-size
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'size-exempt') }}
          WARN_AT: 200
          BLOCK_AT: 300
        shell: python3 {0}
        run: |
          import fnmatch, os, subprocess, sys

          EXCLUDE_GLOBS = [
              "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml",
              "bun.lock", "bun.lockb", "Cargo.lock", "poetry.lock", "uv.lock",
              "Pipfile.lock", "Gemfile.lock", "composer.lock", "go.sum", "flake.lock",
              "mix.lock", "pubspec.lock", "Podfile.lock", "packages.lock.json",
              "*.snap", "*.min.js", "*.min.css", "*.map", "*.pb.go", "*_pb2.py",
              "*_pb2.pyi", "*.generated.*", "*.g.dart", "*.freezed.dart",
          ]
          EXCLUDE_DIRS = ["vendor", "node_modules", "__snapshots__", "third_party"]

          warn_at, block_at = int(os.environ["WARN_AT"]), int(os.environ["BLOCK_AT"])
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]

          out = subprocess.run(
              ["git", "diff", "--numstat", "--no-renames", f"{base}...{head}"],
              capture_output=True, text=True, check=True,
          ).stdout
          rows = []
          for line in out.splitlines():
              add, dele, path = line.split("\t", 2)
              if add != "-":  # skip binary files
                  rows.append((int(add) + int(dele), path))

          generated = set()
          if rows:
              attrs = subprocess.run(
                  ["git", "check-attr", "--stdin", "-z", "linguist-generated", "linguist-vendored"],
                  input="\0".join(p for _, p in rows) + "\0", capture_output=True, text=True,
              ).stdout.split("\0")
              for i in range(0, len(attrs) - 2, 3):
                  if attrs[i + 2] in ("set", "true"):
                      generated.add(attrs[i])

          def excluded(path):
              parts = path.split("/")
              return (
                  any(d in parts[:-1] for d in EXCLUDE_DIRS)
                  or any(fnmatch.fnmatch(parts[-1], g) for g in EXCLUDE_GLOBS)
                  or path in generated
              )

          counted = sum(n for n, p in rows if not excluded(p))
          skipped = sum(n for n, p in rows if excluded(p))
          msg = f"{counted} changed lines vs {os.environ['BASE_REF']}"
          if skipped:
              msg += f" ({skipped} generated/lockfile lines not counted)"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### PR size\n\n{msg}\n\nLimits: warn over {warn_at}, fail over {block_at}.\n")

          if counted > block_at:
              if os.environ["EXEMPT"] == "true":
                  print(f"::notice title=PR size (exempt)::{msg}; over {block_at} but labelled size-exempt")
                  sys.exit(0)
              print(f"::error title=PR too large::{msg}; the limit is {block_at}. "
                    "Split it into self-contained layers, or add the size-exempt label if approved.")
              sys.exit(1)
          if counted > warn_at:
              print(f"::warning title=PR size::{msg}; over {warn_at}, consider splitting")
          else:
              print(msg)
